<template>
    <div class="slds-box slds-theme_default slds-scrollable_x">
    <lightning-card title="Document Checklist" icon-name="standard:drafts">
                <table class="slds-table slds-table_cell-buffer slds-table_bordered" style="width: 100%;">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th class="" scope="col">
                                <div title="File Name">File Name</div>
                            </th>
                            <th class="" scope="col">
                                <div title="Status">Status</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={checklists} for:item="checklist">
                            <tr key={checklist.Id} class="slds-hint-parent">
                                <td data-label="File Name" >
                                    <div title={checklist.Name}>{checklist.Name}</div>
                                </td>
                                <td data-label="Status" >
                                    <div title={checklist.Status__c}>{checklist.Status__c}</div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
    </lightning-card>
    </div>  
</template>
