<template>
    <td data-label="Received" >
        <div title={checklist.Received__c}>{checklist.Received__c}</div>
    </td>
        <td data-label="File Name" >
            <div title={checklist.Name}>{checklist.Name}</div>
        </td>
        <td data-label="Status" >
                <lightning-combobox 
                    name="status"    
                    value={checklist.Status__c}
                    variant="label-hidden"
                    options={statusOptions}
                    onchange={handleChecklistChange}
                ></lightning-combobox>
        </td>
        <td data-label="Notes" >
            <div title={checklist.Notes__c}>{checklist.Notes__c}</div>
        </td>
</template>
