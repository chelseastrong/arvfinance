<template>
        <td data-label="Received" class="checkbox-cell">
            <lightning-input type="checkbox" name={checklist.Received__c} checked={checklist.Received__c} class="checkbox-cell"></lightning-input>
        </td>
        <td data-label="File Name" >
            <div title={checklist.Name}>{checklist.Name}</div>
        </td>
        <td data-label="Status" >
                <lightning-combobox 
                    name="status"    
                    value={checklist.Status__c}
                    variant="label-hidden"
                    options={statusOptions}
                    onchange={handleChecklistChange}
                ></lightning-combobox>
        </td>
        <td data-label="Notes">
            <div class="slds-form-element slds-form-element__control">
                <textarea 
                    name="Notes"
                    rows="1"
                    class="slds-textarea align-top"
                    oninput={autoGrow}
                >{checklist.Notes__c}</textarea>
            </div>
        </td>
</template>
